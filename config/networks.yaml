# The 19 real networks: 16 training networks (nine of them are also test networks) and 3 further test networks.
# file: name in data/raw/; sha256: fingerprint of that file; url: where it comes from.
# columns: position of node, node and time in a row (counted from 0); sep: column separator (default: blanks).
# skip: header rows; two_kinds: the two columns name different kinds of nodes (users and items);
# proximity: sensor data, where a repeated identical row is the same contact and counts once;
# zip: file inside the archive; no_device: rows without a second device (negative id) are skipped.


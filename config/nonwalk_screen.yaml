version: 1
presets:
  smoke:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/nonwalk_screen/smoke_cases.csv.gz
    W: 5
    seed: 20260820
    budgets: [100, 400]
    seeds: 1
    strategies:
      - uniform_event_reservoir
      - time_prefix_events
      - time_random_window_events
      - node_panel_full_history
      - ego_recent_k1
      - ego_recent_k5
      - ego_recent_k20
      - ego_recent_kall
    node_panel_min_budget: 400
    recent_events_json_limit: 100
    stationarity_bins: 10

  panel32:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/nonwalk_screen/panel32_cases.csv.gz
    W: 5
    seed: 20260820
    budgets: [100, 400, 800, 1600, 3200]
    seeds: 4
    strategies:
      - uniform_event_reservoir
      - time_prefix_events
      - time_random_window_events
      - node_panel_full_history
      - ego_recent_k1
      - ego_recent_k5
      - ego_recent_k20
      - ego_recent_kall
    node_panel_min_budget: 400
    recent_events_json_limit: 100
    stationarity_bins: 10

  # Crawl-regime extension: strategies that observe the graph under the same
  # partial-access rule as a random walk -- query a node, follow what it
  # returns.  The contrast against ego_recent_k* at equal k is the frontier
  # rule alone; the contrast against the walk arms is the traversal design.
  crawl_extra:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/nonwalk_crawl_screen/crawl_cases.csv.gz
    W: 5
    seed: 20260820
    budgets: [100, 400, 800, 1600, 3200]
    seeds: 4
    strategies:
      - bfs_crawl_k5
      - bfs_crawl_k20
      - forest_fire_k5
      - forest_fire_k20
    node_panel_min_budget: 400
    recent_events_json_limit: 100
    stationarity_bins: 10
    forest_fire_burn_prob: 0.35

  g0b_panel:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0b_headroom_2026_09/panel_candidates.csv.gz
    W: 5
    seed: 20260831
    budgets: [800]
    seeds: 8
    strategies:
      - node_panel_full_history
      - activity_proportional_dyad_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0b_benchmark:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0b_headroom_2026_09/benchmark_winner.csv.gz
    W: 5
    seed: 20260711
    budgets: [800]
    seeds: 4
    strategies:
      - activity_proportional_dyad_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0b_panel_b:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0b_headroom_2026_09/panel_candidate_b.csv.gz
    W: 5
    seed: 20260831
    budgets: [800]
    seeds: 8
    strategies:
      - activity_proportional_dyad_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

# Current design only. This is not an executable experiment preset.
W: 5

target:
  components: [rho_2, rho_3, rho_4, rho_5]
  denominator: E_full
  constraint: "1 >= rho_2 >= rho_3 >= rho_4 >= rho_5 >= 0"
  primary_error: ProfileMAE
  mean_occupancy: derived_from_profile

sampling:
  reference: node_panel_full_history
  selection: simple_random_walk_full_history
  history_loss: recency_truncation
  both: sampled_event_stream

replication:
  sampler_seeds: 4
  llm_repeats: 3
  preserve_raw_responses: true
  master_seed: null  # Not selected by the archival cleanup.

datasets:
  registry: config/datasets.yaml
  panel_status: pending_census

controlled_timing:
  candidate_rho_2_targets: [0.15, 0.55]
  targets_status: pending_feasibility
  preserve: [nodes, collapsed_topology, per_edge_event_counts]

dar:
  substrate: DCSBM
  sizes: [500, 1500]
  temporal_memory: [low, high]

activity_driven:
  modes: [memoryless, tie_reinforcement]

prompt:
  zero_shot: true
  final_json_keys: [rho_2, rho_3, rho_4, rho_5]
  repair_raw_outputs: false

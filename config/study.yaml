# Summary of the study design (descriptive; the code reads its settings from src/ and config/pipeline.yaml).
design: docs/DESIGN.md
results: docs/results/final
W: 5
master_seed: 20260921
arms:
  R: uniform_node_panel_full_history
  S: interaction_following_walk_with_crawl_log
  # S_obs (the same walk without the crawl log) is drawn for reproducibility of the random streams only.
  H: uniform_node_panel_history_fraction_0.60
  B: independent_bernoulli_event_retention
walk:
  start: uniform_full_vertex_set
  weight: dyad_event_count
  steps: fixed_L_without_restart_or_burnin
  observation: each_traversed_dyad_once_with_complete_history
  S_columns: [inv_events, traversals, traversals_per_event]
budget:
  fraction: 0.10
  target: expected_discovered_active_dyad_windows
  tolerance: 0.05
  calibration_walks: 256
  validation_walks: 1024
  extended_validation_walks: 4096
replication:
  sampler_draws_per_arm: 3
  saturated_H_draws: 1
  qwen_repeats: 3
  training_sampler_draws_per_arm: 5
training:
  real_sources: 16
  folds: leave_one_real_source_out
  synthetic_pool_train: 400
  synthetic_pool_dev: 100
  et_variant: pooled_only
  et_features: {R: 175, H: 175, S: 174, B: 174}
  et_selection: nested_leave_one_real_training_source_out
references:            # four estimators per arm: plugin, median, MLE, ExtraTrees
  R: plugin
  S: mle
  H: mle
  B: mle
evaluation:
  primary: equal_source_MAE_2_real
  secondary: ProfileMAE
  llm_valid_only: true
  no_clipping_or_repair: true
  source_level_exact_signflip: true
qwen:
  generation_arms: [R, S, H, B]
  R_H_source: completed_panel_release_archive
  S_B_source: stage1_archive
api_main:
  arms: [R, S, H, B]
  deepseek: {model: deepseek-flash, reasoning: high, repeats: 3, off_peak_only: true}
  openai: {model: gpt-6-sol, reasoning: high, repeats: 3, transport: batch_responses, variants: [no_tools, hosted_python]}
reasoning_exposure:
  deepseek: raw_provider_reasoning
  openai: provider_reasoning_summary
  qwen: generated_reasoning_block
panel:
  real: [sp_hospital, sp_highschool2013, copenhagen_bluetooth, sp_workplace, snap_email_eu, snap_collegemsg, snap_mathoverflow, nr_digg_reply,
         reality_mining, lkml_reply, sp_malawi, nr_radoslaw_email]   # last four prepared in stage 2 (config/pipeline.yaml)
  surrogates: one_parent_matched_Pwt_per_real
  synthetic: [dar_a0_r1, dar_a08_r1, dar_a0_r2, dar_a08_r2, ad_memoryless_r1, ad_memory_r1, ad_memoryless_r2, ad_memory_r2]

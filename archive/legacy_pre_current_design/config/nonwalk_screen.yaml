version: 1
presets:
  smoke:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/nonwalk_screen/smoke_cases.csv.gz
    W: 5
    seed: 20260820
    budgets: [100, 400]
    seeds: 1
    strategies:
      - uniform_event_reservoir
      - time_prefix_events
      - time_random_window_events
      - node_panel_full_history
      - ego_recent_k1
      - ego_recent_k5
      - ego_recent_k20
      - ego_recent_kall
    node_panel_min_budget: 400
    recent_events_json_limit: 100
    stationarity_bins: 10

  panel32:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/nonwalk_screen/panel32_cases.csv.gz
    W: 5
    seed: 20260820
    budgets: [100, 400, 800, 1600, 3200]
    seeds: 4
    strategies:
      - uniform_event_reservoir
      - time_prefix_events
      - time_random_window_events
      - node_panel_full_history
      - ego_recent_k1
      - ego_recent_k5
      - ego_recent_k20
      - ego_recent_kall
    node_panel_min_budget: 400
    recent_events_json_limit: 100
    stationarity_bins: 10

  # Crawl-regime extension: strategies that observe the graph under the same
  # partial-access rule as a random walk -- query a node, follow what it
  # returns.  The contrast against ego_recent_k* at equal k is the frontier
  # rule alone; the contrast against the walk arms is the traversal design.
  crawl_extra:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/nonwalk_crawl_screen/crawl_cases.csv.gz
    W: 5
    seed: 20260820
    budgets: [100, 400, 800, 1600, 3200]
    seeds: 4
    strategies:
      - bfs_crawl_k5
      - bfs_crawl_k20
      - forest_fire_k5
      - forest_fire_k20
    node_panel_min_budget: 400
    recent_events_json_limit: 100
    stationarity_bins: 10
    forest_fire_burn_prob: 0.35

  g0b_panel:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0b_headroom_2026_09/panel_candidates.csv.gz
    W: 5
    seed: 20260831
    budgets: [800]
    seeds: 8
    strategies:
      - node_panel_full_history
      - activity_proportional_dyad_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0b_benchmark:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0b_headroom_2026_09/benchmark_winner.csv.gz
    W: 5
    seed: 20260711
    budgets: [800]
    seeds: 4
    strategies:
      - activity_proportional_dyad_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0b_panel_b:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0b_headroom_2026_09/panel_candidate_b.csv.gz
    W: 5
    seed: 20260831
    budgets: [800]
    seeds: 8
    strategies:
      - activity_proportional_dyad_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # G0c replaces the oracle-weighted G0b arm with event-log discovery followed
  # by complete per-dyad lookup.  The main-budget panel uses eight seeds; the
  # benchmark population supplies group-held-out likelihood and ML references.
  g0c_panel_b:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0c_headroom_2026_09/panel_b.csv.gz
    W: 5
    seed: 20260831
    budgets: [800]
    seeds: 8
    strategies:
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0c_benchmark_main:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0c_headroom_2026_09/benchmark_main.csv.gz
    W: 5
    seed: 20260711
    budgets: [800]
    seeds: 4
    strategies:
      - node_panel_full_history
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # Seed-0 sensitivity budget chosen after the G0c panel probe: it gives
  # median dyad coverage 0.0553, against 0.0555 for the three walk arms.
  g0c_panel_b_coverage:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0c_headroom_2026_09/panel_b_coverage.csv.gz
    W: 5
    seed: 20260831
    budgets: [10500]
    seeds: 1
    strategies:
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0c_benchmark_b_coverage:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0c_headroom_2026_09/benchmark_b_coverage.csv.gz
    W: 5
    seed: 20260711
    budgets: [10500]
    seeds: 4
    strategies:
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # G0d: budgets set by dyad-coverage parity with the three walk arms at 800
  # unique events, whose pooled eight-seed median coverage is 0.0548.  The
  # walks are unchanged; only the two whole-entity arms move.  Selected from
  # `src/g0d_budget_ladder.py` over a 28-point grid.
  #
  # The panels run 16 seed slots rather than 8 so the prespecified
  # empty-sample rule -- advance along the seed sequence until the sample is
  # non-empty -- has headroom to draw from.  Arm A cannot reach a structurally
  # zero empty rate at any coverage-parity budget: the panel's largest node
  # carries 10,571 incident events, so a whole-node response only always fits
  # above budget 12,000, nearly five times the parity budget.
  g0d_panel_a:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0d_headroom_2026_09/panel_a.csv.gz
    W: 5
    seed: 20260831
    budgets: [2500]
    seeds: 16
    strategies:
      - node_panel_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0d_panel_b:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0d_headroom_2026_09/panel_b.csv.gz
    W: 5
    seed: 20260831
    budgets: [9600]
    seeds: 16
    strategies:
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # The budget G0c proposed for arm B, kept as a measured alternative: its
  # eight-seed median coverage is 0.0610, against 0.0553 at seed 0 alone.
  g0d_panel_b_10500:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0d_headroom_2026_09/panel_b_10500.csv.gz
    W: 5
    seed: 20260831
    budgets: [10500]
    seeds: 16
    strategies:
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # Benchmark population at the G0d budgets: supplies the group-held-out
  # observation model and the supervised reference, exactly as in G0c.
  g0d_benchmark_a:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0d_headroom_2026_09/benchmark_a.csv.gz
    W: 5
    seed: 20260711
    budgets: [2500]
    seeds: 4
    strategies:
      - node_panel_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0d_benchmark_b:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0d_headroom_2026_09/benchmark_b.csv.gz
    W: 5
    seed: 20260711
    budgets: [9600]
    seeds: 4
    strategies:
      - event_sample_then_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # G0d sensitivity (Decision 3): arm A at the structurally empty-free level.
  # The panel's largest node carries 10,571 incident events, so at 12,000 no
  # first draw can overflow and the seed-advance rule never fires.  This
  # isolates whether conditioning on non-emptiness at 2,500 distorts the arm.
  # It is a sensitivity only -- arm A stays at 2,500 in the main run.
  g0d_panel_a_12000:
    manifest: results/final_target_panel/panel32_final.csv
    out: results/g0d_headroom_2026_09/panel_a_12000.csv.gz
    W: 5
    seed: 20260831
    budgets: [12000]
    seeds: 8
    strategies:
      - node_panel_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  g0d_benchmark_a_12000:
    manifest: results/g0_headroom_2026_09/regenerated_benchmark_v2/manifest.csv
    out: results/g0d_headroom_2026_09/benchmark_a_12000.csv.gz
    W: 5
    seed: 20260711
    budgets: [12000]
    seeds: 4
    strategies:
      - node_panel_full_history
    node_panel_min_budget: 800
    recent_events_json_limit: 100
    stationarity_bins: 10

  # ---------- Network Repository (zips; '%' header lines; check cols via --peek) ----------
  nr_radoslaw_email:
    census_audit:
      expected_fields: 4
      originally_directed: "yes"
      timestamp_unit: unknown
      metadata_source: "registry_page"
      time_unit_evidence: "Physical unit remains unknown."
      parser_note: "Local full-file audit: u v weight timestamp; weight is 1 throughout; timestamp is column 3 (zero-based)."
      warnings: "Physical unit not explicitly established for this local export; epoch-sized numbers alone are insufficient."
    label: "ia-radoslaw-email (NetRepo)"
    domain: email
    page_url: "https://networkrepository.com/ia-radoslaw-email.php"
    file: "ia-radoslaw-email.edges"
    format: {delimiter: whitespace, columns: {u: 0, v: 1, t: 3}, comment: "%#", skiprows: 0}
    notes: "Rows: u v w t. Manufacturing company email, ~9 months."

  nr_enron_employees:
    census_audit:
      expected_fields: 4
      originally_directed: "unknown"
      timestamp_unit: unknown
      metadata_source: "registry_page"
      time_unit_evidence: "Physical unit remains unknown."
      parser_note: "Local full-file audit: u v weight timestamp; weight is 1 throughout; timestamp is column 3 (zero-based)."
      warnings: "Physical unit not explicitly established for this local export; epoch-sized numbers alone are insufficient. Original direction is not established by the headerless export/provider landing page. Ambiguous duplicates: about 48% of retained events repeat an earlier same-dyad same-timestamp row; kept as events (no deduplication), which inflates m_e-based columns and count bounds but not K or rho."
    label: "ia-enron-employees (NetRepo)"
    domain: email
    page_url: "https://networkrepository.com/ia-enron-employees.php"
    file: "ia-enron-employees.edges"
    format: {delimiter: whitespace, columns: {u: 0, v: 1, t: 3}, comment: "%#", skiprows: 0}
    notes: "Rows: u v w t."


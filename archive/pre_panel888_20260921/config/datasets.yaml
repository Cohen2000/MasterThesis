  # ---------- Optional preprocessed Copenhagen Networks Study ----------
  # The public CNS release has changed packaging over time. To avoid silently
  # assuming a release-specific column layout, export Bluetooth encounters to
  # this canonical three-column file before running the benchmark.
  copenhagen_bluetooth:
    census_audit:
      expected_fields: 3
      originally_directed: "no"
      timestamp_unit: seconds
      metadata_source: "https://www.nature.com/articles/s41597-019-0325-x"
      time_unit_evidence: "Published data description specifies seconds; local provenance records projection of bt_symmetric.csv."
      parser_note: "Local header u,v,t; merge provenance identifies filtered bt_symmetric.csv; all times are multiples of 300."
      expected_header: "u,v,t"
    label: "Copenhagen Networks Study Bluetooth (preprocessed)"
    domain: proximity
    page_url: "https://www.copenhagenetworksstudy.org/"
    file: "copenhagen_bluetooth.csv.gz"
    format: {delimiter: ",", columns: {u: 0, v: 1, t: 2}, comment: "#%", skiprows: 1}
    notes: "Optional canonical export with header u,v,t. Keep one row per Bluetooth encounter."

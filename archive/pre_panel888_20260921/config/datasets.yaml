# Dataset registry for the persistence census.
# Download each file manually into --data-dir (default: ./data/), keep the
# filename given under "file". URLs are page links; exact filenames can change,
# so run `python census.py --peek <key>` after download to verify column layout.
#
# format fields:
#   delimiter: "whitespace" or ","
#   columns:   0-based indices of source node, target node, timestamp
#   comment:   lines starting with any of these characters are skipped
#   skiprows:  number of header lines to skip

datasets:
  # ---------- SocioPatterns (proximity, CC BY-NC-SA, cite their papers) ----------
  sp_hospital:
    census_audit:
      expected_fields: 5
      originally_directed: "no"
      timestamp_unit: seconds
      metadata_source: "registry_page"
      time_unit_evidence: "Registered provider page documents seconds."
      parser_note: "Local full-file widths and timestamp field agree with the registered provider format."
    label: "Hospital ward (SocioPatterns)"
    domain: proximity
    page_url: "https://sociopatterns.org/datasets/hospital-ward-dynamic-contact-network/"
    file: "hospital_lyon_contacts.dat.gz"
    format: {delimiter: whitespace, columns: {t: 0, u: 1, v: 2}, comment: "#%", skiprows: 0}
    notes: "Cols: t i j Si Sj. 20s resolution, ~3 days."

  sp_primaryschool:

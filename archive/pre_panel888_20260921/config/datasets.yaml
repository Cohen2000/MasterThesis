  # ---------- JODIE / standard TG-learning benchmarks (snap.stanford.edu/jodie) ----------
  # Bipartite user-item interactions; the bipartite flag keeps id spaces apart.
  # Published reoccurrence/surprise values exist for these (EdgeBank paper, TGB),
  # so they double as an external sanity check for rho.
  jodie_wikipedia:
    census_audit:
      expected_fields: 3
      originally_directed: "yes"
      timestamp_unit: unknown
      metadata_source: "https://github.com/claws-lab/jodie#dataset-format"
      time_unit_evidence: "Physical unit remains unknown."
      parser_note: "Local three-column projection has header user_id,item_id,timestamp; preserve distinct ID namespaces."
      expected_header: "user_id,item_id,timestamp"
      warnings: "Physical unit of local three-column export is undocumented; source specifies numeric timestamps without a unit."
      direction_note: "yes denotes user-to-item action direction, not a claim about the embedding model graph."
    label: "Wikipedia (JODIE)"
    domain: web_bipartite
    page_url: "https://snap.stanford.edu/jodie/"
    file: "wikipedia.csv"
    format: {delimiter: ",", columns: {u: 0, v: 1, t: 2}, comment: "#%", skiprows: 1, bipartite: true}
    notes: "user_id,item_id,timestamp,... ~1 month of page edits. Standard TG benchmark."

  jodie_reddit:
